name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*|v[0-9]*[0-9A-Za-z._-]) ;;
            *) echo "Unexpected ref name, skipping rename"; exit 1 ;;
          esac
          cp app/build/outputs/apk/debug/app-debug.apk "AI-Eyes-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "AI-Eyes-${GITHUB_REF_NAME}.apk" \
            --title "AI-Eyes ${GITHUB_REF_NAME}" \
            --notes "AI之眼 Android 客户端（debug 签名，供测试安装）。包含离线中文语音识别与 YOLOv8s 物体识别模型，APK 约 200MB。"
